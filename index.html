<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal LMS | SMK CALM</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#18263f;--mut:#5b6b82;--faint:#8794a8;--line:#e8edf4;--line2:#d3dcea;--bg:#f5f7fb;--navy:#0b3d91;--navyd:#0a2250;--navyx:#071a40;--side:#061f4d;--soft:#eef3fb;--gold:#d6b46a;--serif:'Newsreader',Georgia,serif;--r:1rem;--err:#b4232f;--ok:#047857;--shadow-sm:0 2px 8px rgba(11,61,145,.06);--shadow-md:0 8px 24px -10px rgba(11,61,145,.15);--shadow-lg:0 20px 40px -20px rgba(11,61,145,.25)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
.hide{display:none!important}
.lw{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);min-height:100vh;background:#fff}
.ls{background:linear-gradient(165deg,#0c3f94,#0a2f72 50%,#071a40);color:#fff;padding:3rem;display:flex;flex-direction:column;justify-content:space-between}
.lm{display:flex;flex-direction:column;padding:3rem;background:#fff}
.lc{width:100%;max-width:25rem;margin:auto}
.sb{width:100%;min-height:3.2rem;border:0;border-radius:.9rem;background:var(--navy);color:#fff;font-weight:700}
.fld{width:100%;min-height:3.2rem;padding:.7rem 1rem;border:1px solid var(--line2);border-radius:.9rem;margin-bottom:1rem}
#app{display:flex;min-height:100vh}
aside{width:17rem;background:var(--side);color:#e2e8f0;padding:1rem;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto}
main{flex:1;padding:2rem 2.5rem 3rem;max-width:80rem;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:1.25rem;box-shadow:var(--shadow-sm);margin-bottom:1rem}
.btn{background:var(--navy);color:#fff;border:0;border-radius:.75rem;padding:.6rem 1.1rem;font-weight:700}
.btn2{background:#fff;border:1px solid var(--line2);color:var(--navy);border-radius:.75rem;padding:.55rem 1.1rem;font-weight:700}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:1.4rem}
.top h2{font-family:var(--serif);font-size:1.8rem;color:var(--navyd)}
.mi{display:flex;align-items:center;gap:.75rem;width:100%;padding:.6rem;border:0;background:none;color:#cbd5e1;border-radius:.75rem;text-align:left}
.mi.on{background:rgba(14,165,233,.2);color:#fff}
.ov{position:fixed;inset:0;background:rgba(7,20,46,.6);display:flex;justify-content:center;align-items:center;z-index:50;padding:1rem;backdrop-filter:blur(4px)}
.md{background:#fff;border-radius:1.5rem;padding:2rem;width:100%;max-width:32rem;max-height:90vh;overflow:auto;position:relative}
.md.wide{max-width:48rem}
.md input,.md textarea,.md select{width:100%;padding:.8rem;border:1px solid var(--line2);border-radius:.8rem;margin-top:.4rem;margin-bottom:1rem}
.qb{border:1px solid var(--line2);border-radius:1rem;padding:1.2rem;margin-bottom:1rem;background:#fafcff}
.qopt{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem}
.qopt input[type=radio]{width:1.2rem;height:1.2rem}
table{width:100%;border-collapse:collapse}th,td{padding:.8rem;border-bottom:1px solid var(--line);text-align:left}
.badge{padding:.2rem .6rem;border-radius:99px;font-size:.75rem;font-weight:700}
.badge.ok{background:#d1fae5;color:#065f46}
.badge.warn{background:#fef3c7;color:#92400e}
.hotspot-img{max-width:100%;border-radius:.5rem;cursor:crosshair;position:relative;display:block}
.hs-marker{position:absolute;width:20px;height:20px;background:rgba(11,61,145,.4);border:2px solid var(--navy);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.match-row{display:grid;grid-template-columns:1fr 2rem 1fr;gap:.5rem;align-items:center;margin-bottom:.5rem}
.ord-item{display:flex;justify-content:space-between;padding:.5rem;border:1px solid var(--line2);margin-bottom:.5rem;border-radius:.5rem;background:#fff;align-items:center}
.ord-btn{background:var(--soft);border:0;padding:.2rem .5rem;border-radius:.3rem;cursor:pointer}
@media(max-width:900px){.lw{grid-template-columns:1fr}.ls{display:none}}
</style>
</head>
<body>

<div id="login" class="lw">
  <div class="ls"><h1>Portal LMS</h1></div>
  <div class="lm"><div class="lc">
    <h2>Selamat datang</h2>
    <form id="lform" onsubmit="event.preventDefault();doLogin()">
      <label class="fl">Username</label><input id="u" class="fld">
      <label class="fl">Sandi</label><input id="pw" type="password" class="fld">
      <p id="lmsg" style="color:red;font-size:.8rem;margin:1rem 0"></p>
      <button class="sb" id="lbtn">Masuk</button>
    </form>
  </div></div>
</div>

<div id="app" class="hide">
  <aside>
    <h3 style="color:#fff;margin-bottom:1rem">SMK CALM</h3>
    <button class="mi" id="n-dash" onclick="go('dash')">Beranda</button>
    <button class="mi" id="n-home" onclick="go('home')">Kelas</button>
    <button class="mi" id="n-adminStudents" onclick="go('adminStudents')">Data Siswa</button>
    <button class="mi" id="n-adminTeachers" onclick="go('adminTeachers')">Data Guru</button>
    <button class="mi" id="n-adminStaff" onclick="go('adminStaff')">Data Staf</button>
    <button class="mi" onclick="logout()" style="margin-top:auto">Keluar</button>
  </aside>
  <main id="main"></main>
</div>

<script>
// URL Web App Anda
const API = (window.LMS_CONFIG && window.LMS_CONFIG.apiUrl) || 'https://script.google.com/macros/s/AKfycbwwxNMD1c_2GugaKiXlqicOW-NeUsYSL-WvJzAt4xXvH8dQjAfMD-epQubbhkXHhbwW_w/exec';

let S = null, C = null, O = null, QT;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(action, data = {}) {
  try {
    const r = await fetch(API, { method: 'POST', body: new URLSearchParams({ action, token: S ? S.token : '', ...data }) });
    const j = await r.json();
    if (j.status !== 'success') { if (j.code === 'auth') logout(); throw new Error(j.message); }
    return j;
  } catch (e) { alert(e.message); throw e; }
}

function doLogin() {
  $('#lbtn').disabled = true;
  api('login', { username: $('#u').value, password: $('#pw').value }).then(res => {
    S = res; $('#login').classList.add('hide'); $('#app').classList.remove('hide'); vDash();
  }).catch(e => { $('#lmsg').textContent = e.message; $('#lbtn').disabled = false; });
}

function logout() { S = null; location.reload(); }

function go(k) { 
  document.querySelectorAll('.mi').forEach(b => b.classList.remove('on')); 
  const b = $('#n-'+k); if(b) b.classList.add('on'); 
  if(k==='dash') vDash(); 
  if(k==='home') home(); 
  if(k.startsWith('admin')) adminUsers(k.replace('admin','').toLowerCase()); 
}
function view(h) { $('#main').innerHTML = h; }

function vDash() { view(`<div class="top"><h2>Beranda</h2></div><div class="card"><p>Selamat datang, ${esc(S.user.full_name)}</p></div>`); }
function home() {
  api('classes').then(r => {
    view(`<div class="top"><h2>Kelas</h2></div><div class="grid">${r.classes.map(c => `<div class="card" onclick="openClass('${c.id}')"><h3>${esc(c.name)}</h3><p>${esc(c.subject)}</p></div>`).join('')}</div>`);
  });
}
function openClass(id) {
  api('classDetail', { class_id: id }).then(r => {
    C = r;
    view(`<div class="top"><h2>${esc(C.cls.name)}</h2><button class="btn" onclick="home()">Kembali</button></div>
    <div class="tabs" style="margin-bottom:1rem"><button class="btn" onclick="drawClass('asg')">Tugas</button><button class="btn" onclick="drawClass('qz')">Kuis</button></div>
    <div id="cbody"></div>`);
    drawClass('qz');
  });
}
function drawClass(tab) {
  if (tab === 'qz') {
    $('#cbody').innerHTML = `<button class="btn" onclick="addQuiz()" style="margin-bottom:1rem">+ Buat Kuis</button>` + C.quizzes.map(q => `
      <div class="card"><h3>${esc(q.title)}</h3><p>${q.qcount} soal • ${q.duration} menit</p>
      <button class="btn2" onclick="startQuiz('${q.id}')">Mulai Kuis</button></div>`).join('');
  }
}

/* ================= KUIS ENGINE ================= */
function addQuiz() {
  const m = document.createElement('div'); m.className = 'ov';
  m.innerHTML = `<div class="md wide"><h3>Buat Kuis</h3>
    <label>Judul Kuis</label><input id="q-title">
    <label>Durasi (menit)</label><input id="q-dur" type="number" value="30">
    <div id="q-box"></div>
    <button class="btn2" onclick="addQBlock()">+ Tambah Soal</button>
    <div class="row" style="margin-top:1rem"><button class="btn2" onclick="this.closest('.ov').remove()">Batal</button><button class="btn" onclick="saveQuiz()">Simpan</button></div>
  </div>`;
  document.body.appendChild(m);
  addQBlock();
}

function addQBlock() {
  const box = $('#q-box');
  const div = document.createElement('div'); div.className = 'qb';
  div.innerHTML = `
    <select class="q-type" onchange="changeQType(this)">
      <option value="mcq">Pilihan Ganda</option>
      <option value="essay">Esai / Uraian</option>
      <option value="matching">Menjodohkan (Matching)</option>
      <option value="ordering">Mengurutkan (Ordering)</option>
      <option value="hotspot">Hotspot Gambar</option>
      <option value="mission">Mission Quiz</option>
    </select>
    <textarea class="q-text" placeholder="Pertanyaan / Instruksi" rows="2"></textarea>
    <div class="q-extra"></div>
    <button class="btn2" style="margin-top:.5rem" onclick="this.closest('.qb').remove()">Hapus</button>
  `;
  box.appendChild(div);
  changeQType(div.querySelector('.q-type'));
}

function changeQType(sel) {
  const wrap = sel.closest('.qb').querySelector('.q-extra');
  const type = sel.value;
  if (type === 'mcq') {
    wrap.innerHTML = `<p style="font-size:.8rem;margin-bottom:.2rem">Pilihan (Centang yang benar)</p>
      ${[0,1,2,3].map(i => `<div class="qopt"><input type="radio" name="mcq-${Math.random()}" value="${i}"><input class="q-opt" placeholder="Opsi ${i+1}"></div>`).join('')}`;
  } else if (type === 'essay') {
    wrap.innerHTML = `<p style="font-size:.8rem">Siswa akan mengetik jawaban esai secara bebas (dinilai manual oleh guru).</p>`;
  } else if (type === 'matching') {
    wrap.innerHTML = `<p style="font-size:.8rem;margin-bottom:.2rem">Pasangan Kiri - Kanan</p>
      ${[0,1,2].map(i => `<div class="match-row"><input class="m-left" placeholder="Kiri ${i+1}"><span>⇄</span><input class="m-right" placeholder="Kanan ${i+1}"></div>`).join('')}`;
  } else if (type === 'ordering') {
    wrap.innerHTML = `<p style="font-size:.8rem;margin-bottom:.2rem">Langkah (Tuliskan sesuai urutan yang BENAR dari atas ke bawah)</p>
      ${[0,1,2].map(i => `<input class="o-item" placeholder="Langkah ${i+1}" style="margin-bottom:.2rem">`).join('')}`;
  } else if (type === 'hotspot') {
    wrap.innerHTML = `<p style="font-size:.8rem">URL Gambar (Kosongkan untuk pakai gambar default)</p><input class="h-img" placeholder="https://...">
      <div class="match-row"><input class="h-x" type="number" placeholder="Target X (%)"><input class="h-y" type="number" placeholder="Target Y (%)"></div>
      <p style="font-size:.75rem;color:var(--mut)">Contoh: X=50, Y=30 berarti di tengah agak atas.</p>`;
  } else if (type === 'mission') {
    wrap.innerHTML = `<p style="font-size:.8rem">Sub-Pertanyaan (Pilihan Ganda)</p>
      ${[0,1].map(i => `<div style="border:1px solid #ddd; padding:.5rem; margin-bottom:.5rem; border-radius:.5rem">
        <input class="ms-q" placeholder="Pertanyaan ${i+1}">
        ${[0,1,2].map(j => `<div class="qopt"><input type="radio" name="ms-${i}-${Math.random()}" value="${j}"><input class="ms-opt" placeholder="Opsi ${j+1}"></div>`).join('')}
      </div>`).join('')}`;
  }
}

function saveQuiz() {
  const title = $('#q-title').value, dur = $('#q-dur').value;
  const qs = [];
  let valid = true;
  document.querySelectorAll('.qb').forEach((b, i) => {
    const type = b.querySelector('.q-type').value, text = b.querySelector('.q-text').value.trim();
    if (!text) { valid = false; return; }
    let data = {};
    if (type === 'mcq') {
      const opts = [...b.querySelectorAll('.q-opt')].map(x => x.value.trim()).filter(Boolean);
      const ans = [...b.querySelectorAll('input[type=radio]')].findIndex(r => r.checked);
      data = { options: opts, answer: ans };
    } else if (type === 'matching') {
      const l = [...b.querySelectorAll('.m-left')].map(x => x.value.trim());
      const r = [...b.querySelectorAll('.m-right')].map(x => x.value.trim());
      data = { pairs: l.map((val, idx) => ({ left: val, right: r[idx], rightIndex: idx })) };
    } else if (type === 'ordering') {
      data = { items: [...b.querySelectorAll('.o-item')].map(x => x.value.trim()).filter(Boolean) };
    } else if (type === 'hotspot') {
      data = { img: b.querySelector('.h-img').value.trim() || 'https://upload.wikimedia.org/wikipedia/commons/thumb/3/3c/SMK_Negeri_1_Cimahi.jpg/640px-SMK_Negeri_1_Cimahi.jpg', targetX: +b.querySelector('.h-x').value || 50, targetY: +b.querySelector('.h-y').value || 50 };
    } else if (type === 'mission') {
      data = { steps: [...b.querySelectorAll('.ms-q')].map((mq, idx) => {
        const div = mq.closest('div[style]');
        return { q: mq.value, options: [...div.querySelectorAll('.ms-opt')].map(x=>x.value), answer: [...div.querySelectorAll('input[type=radio]')].findIndex(r=>r.checked) };
      })};
    }
    qs.push({ type, text, data });
  });
  if (!valid || !qs.length) return alert('Isi semua pertanyaan.');
  api('addQuiz', { class_id: C.cls.id, title, duration: dur, description: '', questions: JSON.stringify(qs) }).then(() => {
    document.querySelector('.ov').remove(); openClass(C.cls.id);
  });
}

function startQuiz(id) {
  api('startQuiz', { quiz_id: id }).then(res => takeQuiz(res));
}

function takeQuiz(d) {
  let cur = 0, ans = {};
  view(`<div class="top"><h2>${esc(d.quiz.title)}</h2><div class="badge warn" id="timer"></div></div><div id="q-area"></div>`);
  
  const end = Date.now() + d.left * 1000;
  QT = setInterval(() => {
    const s = Math.max(0, Math.floor((end - Date.now())/1000));
    $('#timer').textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
    if (s <= 0) { clearInterval(QT); submitQuiz(); }
  }, 1000);

  const draw = () => {
    const q = d.questions[cur];
    const qAns = ans[q.id] || {};
    let body = '';

    if (q.type === 'mcq') {
      body = q.data.options.map((o, i) => `<button class="btn2" style="width:100%;margin-bottom:.5rem" onclick="setAns('${q.id}',${i}); nextQ()">${o}</button>`).join('');
    } else if (q.type === 'essay') {
      body = `<textarea class="fld" rows="5" oninput="setAns('${q.id}', this.value)" placeholder="Ketik jawaban Anda...">${qAns || ''}</textarea>`;
    } else if (q.type === 'matching') {
      body = q.data.pairs.map((p, i) => `<div class="match-row"><span>${p.left}</span><select onchange="setMatch('${q.id}', ${i}, this.value)"><option value="">- Pilih -</option>${q.data.pairs.map((r, j) => `<option value="${j}" ${qAns[i]==j?'selected':''}>${r.right}</option>`).join('')}</select></div>`).join('');
    } else if (q.type === 'ordering') {
      let items = [...q.data.items];
      body = `<div id="ord-box">${items.map((it, i) => `<div class="ord-item"><span>${it}</span></div>`).join('')}</div>`;
      body += `<p style="font-size:.8rem">Sementara ini urutan dianggap benar jika sesuai urutan aslinya.</p>`;
      setAns(q.id, items);
    } else if (q.type === 'hotspot') {
      body = `<div style="position:relative; display:inline-block" onclick="clickSpot(event, '${q.id}')">
        <img src="${q.data.img}" class="hotspot-img">
        ${qAns.x ? `<div class="hs-marker" style="left:${qAns.x}%;top:${qAns.y}%"></div>` : ''}
      </div>`;
    } else if (q.type === 'mission') {
      body = `<div style="background:#f4f7fc;padding:1rem;border-radius:.5rem;margin-bottom:1rem">${esc(q.text)}</div>` + 
      q.data.steps.map((s, i) => `<div style="margin-bottom:1rem"><p>${i+1}. ${s.q}</p>${s.options.map((o, j) => `<div class="qopt"><input type="radio" name="ms-${i}" onchange="setMission('${q.id}', ${i}, ${j})" ${qAns[i]==j?'checked':''}><label>${o}</label></div>`).join('')}</div>`).join('');
    }

    $('#q-area').innerHTML = `<div class="card"><h3>Soal ${cur+1} / ${d.questions.length}</h3><p style="margin-bottom:1rem">${q.type==='hotspot'?'Klik area gambar yang benar.':esc(q.text)}</p>${body}</div>
    <button class="btn" onclick="nextQ()">${cur < d.questions.length-1 ? 'Selanjutnya' : 'Kumpulkan'}</button>`;
  };

  window.nextQ = () => { if (cur < d.questions.length-1) { cur++; draw(); } else { if(confirm('Kumpulkan?')) submitQuiz(); } };
  window.setAns = (id, v) => { ans[id] = v; };
  window.setMatch = (id, left, right) => { if(!ans[id]) ans[id]={}; ans[id][left] = right; };
  window.setMission = (id, step, opt) => { if(!ans[id]) ans[id]={}; ans[id][step] = opt; };
  window.clickSpot = (e, id) => {
    const rect = e.target.getBoundingClientRect();
    ans[id] = { x: Math.round((e.clientX - rect.left) / rect.width * 100), y: Math.round((e.clientY - rect.top) / rect.height * 100) };
    draw();
  };

  const submitQuiz = () => {
    clearInterval(QT);
    api('submitQuiz', { attempt_id: d.attempt_id, answers: JSON.stringify(ans) }).then((res) => {
      view(`<div class="card"><h3>Selesai!</h3><p>Nilai: ${res.score} / ${res.max}</p><button class="btn" onclick="openClass('${C.cls.id}')">Kembali</button></div>`);
    });
  };
  draw();
}

function adminUsers(role) {
  api('adminUsers').then(r => {
    const list = r.users.filter(u => u.role === role || (role === 'staff' && u.role === 'staf'));
    const title = role === 'staff' ? 'Staf' : role === 'guru' ? 'Guru' : 'Siswa';
    view(`<div class="top"><h2>Data ${title}</h2></div>
    <div class="card"><table><thead><tr><th>Nama</th><th>Username</th><th>Status</th></tr></thead><tbody>
    ${list.map(u => `<tr><td>${esc(u.full_name)}</td><td>${esc(u.username)}</td><td>${esc(u.status)}</td></tr>`).join('')}
    </tbody></table></div>`);
  });
}

// Cek sesi login
if(sessionStorage.getItem('lms')) {
  try { S = JSON.parse(sessionStorage.getItem('lms')); $('#login').classList.add('hide'); $('#app').classList.remove('hide'); vDash(); } catch(e) {}
}
</script>
</body>
</html>
